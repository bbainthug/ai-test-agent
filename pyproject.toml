[project]
name = "ai-test-agent"
version = "0.1.0"
description = "LLM-driven e2e test agent against a real open-source app (Halo): planner -> executor -> judge -> report"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.49",
    "openai>=1.40",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pillow>=10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q"
markers = [
    "halo: 需要本地 Halo 跑起来才能过（默认跳过，见 test_explorer_halo_integration.py）",
]
